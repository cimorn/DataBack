name: Test and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    timeout-minutes: 20
    env:
      DATABACK_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=databack_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements.txt
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name mongodb-ci --network host mongo:7.0 --replSet databack_ci --bind_ip 127.0.0.1
          python scripts/ci_mongo.py
      - name: Frontend tests and build
        run: |
          pnpm test
          pnpm build
      - name: Python and MongoDB tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  publish:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cimorn/databack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
